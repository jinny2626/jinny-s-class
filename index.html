<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 문장 받아쓰기 연습</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
        }

        /* 입체감 있는 요즘 스타일 버튼 (3D tactile effect) */
        .btn-push {
            transition: all 0.15s ease-out;
            transform: translateY(0);
        }
        .btn-push:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        /* Diff 비교 스티커 스타일 */
        .word-correct {
            color: #052e16;
            background-color: #4ade80;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 700;
            display: inline-block;
            margin: 2px;
            box-shadow: 0 2px 0 #166534;
        }
        .word-missing {
            color: #450a0a;
            background-color: #fca5a5;
            padding: 4px 10px;
            border-radius: 9999px;
            text-decoration: line-through;
            font-weight: 700;
            display: inline-block;
            margin: 2px;
            box-shadow: 0 2px 0 #991b1b;
        }
        .word-extra {
            color: #451a03;
            background-color: #fdba74;
            padding: 4px 10px;
            border-radius: 9999px;
            text-decoration: line-through;
            font-weight: 700;
            display: inline-block;
            margin: 2px;
            box-shadow: 0 2px 0 #9a3412;
        }

        /* 네온 글로우 효과 */
        .glow-violet {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
        }
        .glow-emerald {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
        }

        /* 스크롤바 커스텀 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-fuchsia-500 selection:text-white">

    <!-- ========================================== -->
    <!--  수업용 설정 (선생님이 수정하실 부분)      -->
    <!-- ========================================== -->
    <script>
        const CONFIG = {
            // [수업 제목]
            title: "Dictation Challenge 🎧",
            subTitle: "핵심 단어를 먼저 익히고 문장을 받아써 봐!",

            // [음성 읽기 속도 설정]
            normalSpeed: 0.9, // 보통 속도 (0.1 ~ 2.0)
            slowSpeed: 0.6,   // 천천히 속도
            wordSpeed: 0.8,   // 단어 읽기 속도

            // [학습할 영어 문장, 힌트 및 핵심 단어 목록]
            sentences: [
                {
                    id: 1,
                    text: "Welcome to our English class.",
                    hint: "우리 영어 수업에 온 걸 환영해!",
                    words: [
                        { word: "welcome", meaning: "환영하다" },
                        { word: "English", meaning: "영어" },
                        { word: "class", meaning: "수업, 학급" }
                    ]
                },
                {
                    id: 2,
                    text: "Listening to music makes me feel happy.",
                    hint: "음악을 듣는 것은 나를 기쁘게 만들어.",
                    words: [
                        { word: "listen", meaning: "듣다" },
                        { word: "music", meaning: "음악" },
                        { word: "feel", meaning: "느끼다" },
                        { word: "happy", meaning: "행복한, 기쁜" }
                    ]
                },
                {
                    id: 3,
                    text: "Practice makes perfect.",
                    hint: "연습이 완벽을 만든다.",
                    words: [
                        { word: "practice", meaning: "연습, 실천" },
                        { word: "perfect", meaning: "완벽한" }
                    ]
                },
                {
                    id: 4,
                    text: "Could you please repeat that line for me?",
                    hint: "그 줄을 다시 한 번 말해 줄래?",
                    words: [
                        { word: "repeat", meaning: "반복하다, 다시 말하다" },
                        { word: "line", meaning: "줄, 대사" }
                    ]
                },
                {
                    id: 5,
                    text: "Don't be afraid of making mistakes when speaking.",
                    hint: "말할 때 실수하는 걸 두려워하지 마!",
                    words: [
                        { word: "afraid", meaning: "두려워하는" },
                        { word: "mistake", meaning: "실수" },
                        { word: "speak", meaning: "말하다" }
                    ]
                }
            ]
        };
    </script>
    <!-- ========================================== -->

    <!-- 상단 헤더 (트렌디 그래디언트) -->
    <header class="bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 py-6 px-4 shadow-lg relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="max-w-2xl mx-auto text-center relative z-10">
            <span class="inline-block bg-white/20 backdrop-blur-md text-white text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                Middle School English
            </span>
            <h1 id="app-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white drop-shadow-md mb-1"></h1>
            <p id="app-subtitle" class="text-violet-100 text-sm sm:text-base font-medium opacity-90"></p>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">
        
        <!-- 진행 상태 카운트 & 프로그레스 바 -->
        <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border border-slate-700/80 mb-5 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
                    STAGE <span id="current-index" class="text-cyan-400 text-sm">1</span> / <span id="total-count">0</span>
                </span>
                <!-- Step 탭 전환 버튼 -->
                <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-700/60 text-xs font-extrabold">
                    <button id="tab-vocab" onclick="switchStep('vocab')" class="px-3 py-1 rounded-lg transition text-cyan-400 bg-slate-800 shadow">
                        1. 단어 학습
                    </button>
                    <button id="tab-dictation" onclick="switchStep('dictation')" class="px-3 py-1 rounded-lg transition text-slate-400 hover:text-slate-200">
                        2. 문장 받아쓰기
                    </button>
                </div>
                <span id="progress-percent" class="text-xs font-extrabold text-cyan-400 bg-cyan-950/80 px-2.5 py-0.5 rounded-full border border-cyan-500/30">0%</span>
            </div>
            <div class="w-full bg-slate-950 h-3.5 rounded-full p-0.5 overflow-hidden border border-slate-800">
                <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 to-violet-500 h-full w-0 transition-all duration-300 rounded-full shadow-sm"></div>
            </div>
        </div>

        <!-- 카드 컨테이너 -->
        <div class="bg-slate-800/90 rounded-3xl shadow-2xl border border-slate-700/80 p-5 sm:p-7 space-y-6 relative overflow-hidden">
            
            <!-- 번호 및 힌트 뱃지 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-700/60 pb-4">
                <div class="flex items-center gap-2">
                    <span class="bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-sm px-3.5 py-1 rounded-full shadow-md">
                        MISSION <span id="question-num">1</span>
                    </span>
                    <span id="sentence-hint" class="text-slate-300 font-semibold text-sm sm:text-base"></span>
                </div>
                <!-- TTS 경고 -->
                <div id="tts-warning" class="hidden text-xs text-amber-300 bg-amber-950/60 border border-amber-700/50 p-2 rounded-xl">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> 음성을 지원하지 않는 브라우저입니다.
                </div>
            </div>

            <!-- STEP 1: 핵심 단어 미리보기 (Vocabulary Mode) -->
            <div id="step-vocab-section" class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-book-bookmark"></i> Key Vocabulary
                    </h3>
                    <span class="text-xs text-slate-400">단어를 눌러 발음을 확인하세요!</span>
                </div>

                <div id="vocab-cards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- 단어 카드가 JS로 dynamic하게 생성됩니다 -->
                </div>

                <button onclick="switchStep('dictation')" 
                    class="btn-push w-full mt-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3.5 px-5 rounded-2xl border-b-4 border-cyan-800 shadow-lg text-base flex items-center justify-center gap-2">
                    <span>단어 익히기 완료! 받아쓰기 도전 🚀</span>
                </button>
            </div>

            <!-- STEP 2: 문장 받아쓰기 (Dictation Mode) -->
            <div id="step-dictation-section" class="hidden space-y-6">
                <!-- 오디오 재생 버튼 3종 (3D 네온 스타일) -->
                <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
                    <button id="btn-play" onclick="playAudio(CONFIG.normalSpeed)" 
                        class="btn-push bg-violet-600 hover:bg-violet-500 text-white font-bold py-3.5 px-2 rounded-2xl border-b-4 border-violet-800 shadow-lg glow-violet flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                        <i class="fa-solid fa-volume-high text-lg"></i>
                        <span>듣기</span>
                    </button>
                    <button id="btn-replay" onclick="playAudio(CONFIG.normalSpeed)" 
                        class="btn-push bg-slate-700 hover:bg-slate-600 text-white font-bold py-3.5 px-2 rounded-2xl border-b-4 border-slate-900 shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                        <i class="fa-solid fa-rotate-right text-lg"></i>
                        <span>다시 듣기</span>
                    </button>
                    <button id="btn-slow" onclick="playAudio(CONFIG.slowSpeed)" 
                        class="btn-push bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 px-2 rounded-2xl border-b-4 border-cyan-800 shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                        <i class="fa-solid fa-turtle text-lg"></i>
                        <span>천천히</span>
                    </button>
                </div>

                <!-- 학생 입력 창 -->
                <div class="space-y-2">
                    <label for="user-input" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
                        <i class="fa-solid fa-keyboard text-cyan-400 mr-1"></i> Answer Box
                    </label>
                    <textarea id="user-input" rows="3" 
                        placeholder="들리는 영문장을 여기에 입력해보세요!" 
                        class="w-full p-4 bg-slate-900/90 text-white placeholder-slate-500 border-2 border-slate-700 rounded-2xl focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 outline-none resize-none text-base sm:text-lg font-medium transition shadow-inner leading-relaxed"></textarea>
                </div>

                <!-- 정답 확인 버튼 -->
                <div>
                    <button onclick="checkAnswer()" 
                        class="btn-push w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 px-6 rounded-2xl border-b-4 border-emerald-700 shadow-lg glow-emerald text-base sm:text-lg flex items-center justify-center gap-2 tracking-wide">
                        <i class="fa-solid fa-bolt text-xl"></i>
                        <span>정답 채점하기</span>
                    </button>
                </div>

                <!-- 결과 표시 영역 -->
                <div id="result-box" class="hidden border-t border-slate-700/80 pt-5 space-y-4">
                    <div class="flex items-center gap-2 font-black text-lg" id="result-status"></div>

                    <!-- 비교 분석 리포트 -->
                    <div class="bg-slate-900/80 p-4 sm:p-5 rounded-2xl border border-slate-700/70 space-y-3">
                        <div>
                            <div class="text-xs text-slate-400 font-bold mb-1 uppercase tracking-wider">🎯 Original Text</div>
                            <div id="original-text-display" class="text-base sm:text-lg font-bold text-cyan-300 leading-relaxed"></div>
                        </div>
                        <hr class="border-slate-800">
                        <div>
                            <div class="text-xs text-slate-400 font-bold mb-1 uppercase tracking-wider">🔍 Word Analysis</div>
                            <div id="diff-display" class="text-base sm:text-lg font-medium leading-relaxed"></div>
                        </div>
                    </div>

                    <!-- 범례 카트리지 -->
                    <div class="flex flex-wrap gap-3 text-xs font-bold text-slate-400 pt-1 justify-center sm:justify-start">
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-emerald-400 rounded-full inline-block shadow"></span> 맞은 단어</span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-red-400 rounded-full inline-block shadow"></span> 빠뜨린 단어</span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-orange-400 rounded-full inline-block shadow"></span> 틀린/추가 단어</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 하단 이전/다음 버튼 -->
        <div class="flex justify-between items-center mt-6">
            <button id="btn-prev" onclick="prevSentence()" 
                class="btn-push bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 px-5 rounded-2xl border-b-2 border-slate-900 shadow transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2 text-sm sm:text-base">
                <i class="fa-solid fa-chevron-left"></i> 이전
            </button>
            <button id="btn-next" onclick="nextSentence()" 
                class="btn-push bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-3 px-6 rounded-2xl border-b-2 border-indigo-900 shadow-md transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2 text-sm sm:text-base">
                다음 <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="text-center py-4 text-xs text-slate-500 font-medium">
        English Dictation Web App &bull; No Server Needed
    </footer>

    <!-- 웹 애플리케이션 로직 -->
    <script>
        let currentIndex = 0;
        let currentStep = 'vocab'; // 'vocab' 또는 'dictation'
        let synth = window.speechSynthesis;
        let englishVoice = null;

        // 페이지 로드 시 초기화
        window.onload = function() {
            document.getElementById('app-title').innerText = CONFIG.title;
            document.getElementById('app-subtitle').innerText = CONFIG.subTitle;
            document.getElementById('total-count').innerText = CONFIG.sentences.length;

            initVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = initVoices;
            }

            loadSentence(currentIndex);

            // Ctrl/Cmd + Enter 키 정답 제출 지원
            document.getElementById('user-input').addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    checkAnswer();
                }
            });
        };

        // 영어 TTS 음성 가져오기
        function initVoices() {
            if (!synth) {
                document.getElementById('tts-warning').classList.remove('hidden');
                return;
            }
            const voices = synth.getVoices();
            englishVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB') || v.lang.startsWith('en')) || null;
        }

        // 스텝(단어 학습 vs 문장 받아쓰기) 전환
        function switchStep(step) {
            currentStep = step;
            const vocabSec = document.getElementById('step-vocab-section');
            const dictSec = document.getElementById('step-dictation-section');
            const tabVocab = document.getElementById('tab-vocab');
            const tabDictation = document.getElementById('tab-dictation');

            if (step === 'vocab') {
                vocabSec.classList.remove('hidden');
                dictSec.classList.add('hidden');

                tabVocab.className = "px-3 py-1 rounded-lg transition text-cyan-400 bg-slate-800 shadow font-bold";
                tabDictation.className = "px-3 py-1 rounded-lg transition text-slate-400 hover:text-slate-200";
            } else {
                vocabSec.classList.add('hidden');
                dictSec.classList.remove('hidden');

                tabDictation.className = "px-3 py-1 rounded-lg transition text-cyan-400 bg-slate-800 shadow font-bold";
                tabVocab.className = "px-3 py-1 rounded-lg transition text-slate-400 hover:text-slate-200";
                
                // 받아쓰기 스텝으로 전환되면 자동으로 첫 발음 1회 듣기
                playAudio(CONFIG.normalSpeed);
            }
        }

        // 현재 문장 및 단어 로딩
        function loadSentence(index) {
            const currentData = CONFIG.sentences[index];

            document.getElementById('question-num').innerText = index + 1;
            document.getElementById('current-index').innerText = index + 1;
            document.getElementById('sentence-hint').innerText = currentData.hint ? `💡 ${currentData.hint}` : '';
            
            // 단어 카드 생성
            const vocabContainer = document.getElementById('vocab-cards-container');
            vocabContainer.innerHTML = '';

            if (currentData.words && currentData.words.length > 0) {
                currentData.words.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/80 border border-slate-700/70 hover:border-cyan-500/60 p-3.5 rounded-2xl flex items-center justify-between cursor-pointer group transition shadow-sm active:scale-95";
                    card.onclick = () => speakWord(item.word);
                    card.innerHTML = `
                        <div>
                            <div class="text-cyan-300 font-extrabold text-lg group-hover:text-cyan-200">${item.word}</div>
                            <div class="text-slate-400 text-xs font-medium">${item.meaning}</div>
                        </div>
                        <div class="w-9 h-9 rounded-xl bg-cyan-950/80 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:bg-cyan-500 group-hover:text-slate-950 transition">
                            <i class="fa-solid fa-volume-low"></i>
                        </div>
                    `;
                    vocabContainer.appendChild(card);
                });
            } else {
                vocabContainer.innerHTML = `<div class="col-span-2 text-center text-slate-500 text-sm py-4">등록된 핵심 단어가 없습니다.</div>`;
            }

            document.getElementById('user-input').value = '';
            document.getElementById('result-box').classList.add('hidden');

            const progressPercent = Math.round(((index + 1) / CONFIG.sentences.length) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-percent').innerText = `${progressPercent}%`;

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === CONFIG.sentences.length - 1;

            // 기본 스텝은 단어 학습으로 초기화
            switchStep('vocab');
        }

        // 개별 단어 TTS 발음
        function speakWord(word) {
            if (!synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.rate = CONFIG.wordSpeed || 0.8;
            utterance.lang = 'en-US';
            if (englishVoice) utterance.voice = englishVoice;
            synth.speak(utterance);
        }

        // 문장 음성 읽기 함수
        function playAudio(rate = 0.9) {
            if (!synth) {
                alert("이 기기나 브라우저에서는 음성 읽기(TTS)를 지원하지 않습니다.");
                return;
            }

            synth.cancel();

            const text = CONFIG.sentences[currentIndex].text;
            const utterance = new SpeechSynthesisUtterance(text);
            
            utterance.rate = rate;
            utterance.lang = 'en-US';

            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            synth.speak(utterance);
        }

        // 단어 정규화
        function cleanWord(word) {
            return word.toLowerCase().replace(/[^a-z0-9']/g, '');
        }

        // 단어 토큰 분리
        function tokenize(text) {
            return text.trim().split(/\s+/).filter(w => w.length > 0);
        }

        // LCS 알고리즘 기반 단어 단위 Diff 비교
        function compareSentences(original, user) {
            const origWords = tokenize(original);
            const userWords = tokenize(user);

            const m = origWords.length;
            const n = userWords.length;

            const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (cleanWord(origWords[i - 1]) === cleanWord(userWords[j - 1])) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            let i = m, j = n;
            const diff = [];

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && cleanWord(origWords[i - 1]) === cleanWord(userWords[j - 1])) {
                    diff.unshift({ type: 'correct', value: origWords[i - 1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    diff.unshift({ type: 'extra', value: userWords[j - 1] });
                    j--;
                } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                    diff.unshift({ type: 'missing', value: origWords[i - 1] });
                    i--;
                }
            }

            return { diff };
        }

        // 채점 실행 및 결과 렌더링
        function checkAnswer() {
            const userInput = document.getElementById('user-input').value;
            const originalText = CONFIG.sentences[currentIndex].text;

            if (!userInput.trim()) {
                alert("들리는 문장을 먼저 입력해 보세요!");
                return;
            }

            const { diff } = compareSentences(originalText, userInput);

            let diffHTML = '';
            let isPerfect = true;

            diff.forEach(item => {
                if (item.type === 'correct') {
                    diffHTML += `<span class="word-correct">${item.value}</span> `;
                } else if (item.type === 'missing') {
                    diffHTML += `<span class="word-missing" title="빠뜨린 단어">${item.value}</span> `;
                    isPerfect = false;
                } else if (item.type === 'extra') {
                    diffHTML += `<span class="word-extra" title="잘못/추가된 단어">${item.value}</span> `;
                    isPerfect = false;
                }
            });

            document.getElementById('original-text-display').innerText = originalText;
            document.getElementById('diff-display').innerHTML = diffHTML;

            const statusEl = document.getElementById('result-status');
            if (isPerfect) {
                statusEl.className = "flex items-center gap-2 font-black text-lg text-emerald-400";
                statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-2xl"></i> <span>PERFECT! 완전 완벽해! 🔥🎉</span>`;
            } else {
                statusEl.className = "flex items-center gap-2 font-black text-lg text-amber-400";
                statusEl.innerHTML = `<i class="fa-solid fa-fire text-2xl"></i> <span>아쉬워요! 틀린 낱말을 다듬어 볼까요?</span>`;
            }

            document.getElementById('result-box').classList.remove('hidden');
        }

        // 이전/다음 문장 이동
        function prevSentence() {
            if (currentIndex > 0) {
                currentIndex--;
                loadSentence(currentIndex);
            }
        }

        function nextSentence() {
            if (currentIndex < CONFIG.sentences.length - 1) {
                currentIndex++;
                loadSentence(currentIndex);
            }
        }
    </script>
</body>
</html>
